services:
  db:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    environment:
      DB_HOST: db
      REGNO: "2400290120211"
    env_file: .env
    networks:
      - frontend_net
      - backend_net
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "8011:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend_net
    depends_on:
      - backend

networks:
  frontend_net:
  backend_net:

volumes:
  db_data: